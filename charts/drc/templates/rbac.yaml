apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "drc.fullname" . }}
  labels:
    {{- include "drc.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "drc.fullname" . }}
  labels:
    {{- include "drc.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "drc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "drc.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
